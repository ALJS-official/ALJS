<!doctype html><html lang="zh"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战绩记录 - 果汁百科</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="icon" href="static/images/logo3.png"> <style>
    body { background:#161616; color:#fff; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    .navbar { background-color:rgba(107,70,193,.5); backdrop-filter:blur(10px); }
    .card { background:#0d0d0d; color:#eee; border:1px solid #533794; box-shadow:0 4px 12px rgba(107,70,193,.25); }
</style></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="./">果汁百科 / Juicypedia</a><a class="nav-link text-light" href="events/">赛事记录</a></div></nav><main class="container my-5"><h1>战绩记录</h1><div class="row g-3 mt-2" id="items"><p>正在加载…</p></div></main><script>
const e=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
fetch('data/records.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(items=>document.getElementById('items').innerHTML=items.map(x=>`<div class="col-md-4"><div class="card h-100"><div class="card-body"><h5 class="card-title">${e(x.match)}</h5><p class="card-text">赛事: ${e(x.event)}</p><p class="card-text">比分: ${e(x.score)}</p><p class="card-text">${e(x.details)}</p></div></div></div>`).join('')).catch(()=>document.getElementById('items').innerHTML='<p>数据加载失败。</p>');
</script></body></html>
