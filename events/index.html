<!DOCTYPE html>
<html lang="zh">
<head>
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.5, maximum-scale=0.8, user-scalable=no">
    <title>赛事记录 - 果汁百科</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="static/images/logo3.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="static/images/logo3.png" sizes="180x180">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #161616; color:#fff; }
        .navbar { background-color: rgba(107,70,193,.5); backdrop-filter: blur(10px); color:#fff; }
        .brand-container { text-align:center; display:flex; flex-direction:column; align-items:center; }
        .brand-container .navbar-brand:first-child { font-size:2rem; font-weight:bold; line-height:1.2; }
        .brand-container .navbar-brand:last-child { font-size:1rem; color:#BBB; margin-top:-5px; }
        .category { border-top:1px solid #2b2b2b; }
        .category:last-child { border-bottom:1px solid #2b2b2b; }
        .category-button {
            width:100%; border:0; background:transparent; color:#fff; padding:24px 4px;
            display:flex; justify-content:space-between; align-items:center; text-align:left;
            font-size:1.35rem; font-weight:600; letter-spacing:.02em;
        }
        .category-button .sub { color:#777; font-size:.78rem; font-weight:500; letter-spacing:.12em; margin-left:12px; }
        .category-button .arrow { color:#8663d5; font-size:1.35rem; transition:transform .2s ease; }
        .category-button[aria-expanded="true"] .arrow { transform:rotate(180deg); }
        .event-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; padding:0 0 26px; }
        .event-card {
            position: relative;
            text-align: right;
            min-height: 150px;
            padding: 18px;
            background: #101010;
            overflow: hidden;
            transition:
                    background .22s ease,
                    transform .22s ease;
        }

        .event-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #533794;
            transition:
                    width .24s cubic-bezier(.2,.8,.2,1),
                    box-shadow .24s ease;
        }

        .event-card:hover {
            background: #191919;
            transform: translateY(-2px);
        }

        .event-card:hover::before {
            width: 80px;
            box-shadow: 3px 0 14px rgba(111, 69, 197, .28);
        }
        .event-card.unavailable { opacity:.5; }
        .event-name { font-size:1.25rem; font-weight:700; margin-bottom:22px; }
        .event-meta { color:#aaa; font-size:.9rem; line-height:1.7; }
        .event-status { color:#666; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; margin-top:12px; }
        .empty-events { color:#666; letter-spacing:.12em; font-size:.85rem; padding:8px 0 28px; }
        .container h1 { margin-bottom:30px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <img src="static/images/logo.png" alt="ALJS Logo" height="80" class="me-2">
            <div class="brand-container">
                <a class="navbar-brand" href="./">果汁百科</a>
                <a class="navbar-brand" href="./">Juicypedia</a>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="./">回到主页</a></li></ul></div>
        </div>
    </nav>
    <main class="container my-5">
        <h1>赛事记录</h1>
        <div id="categories"><div class="empty-events">LOADING...</div></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
      async function loadCompetitions() {
        const root = document.getElementById('categories');
        try {
          const response = await fetch('data/competitions.json');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const catalog = await response.json();
          root.innerHTML = (catalog.categories || []).map((category, categoryIndex) => {
            const events = category.events || [];
            const body = events.length ? events.map(event => `
              <div class="event-card ${event.dataFile ? '' : 'unavailable'}">
                <div class="event-name">${escapeHtml(event.name)}</div>
                <div class="event-meta">
                  ${event.date ? `<div>${escapeHtml(event.date)}</div>` : ''}
                  ${event.winner ? `<div>Winner: ${escapeHtml(event.winner)}</div>` : ''}
                  ${event.description ? `<div>${escapeHtml(event.description)}</div>` : ''}
                </div>
                ${event.dataFile
                  ? `<a class="stretched-link" href="match/?event=${encodeURIComponent(event.id)}" aria-label="${escapeHtml(event.name)}"></a>`
                  : '<div class="event-status">NO DATA AVAILABLE</div>'}
              </div>`).join('') : '<div class="empty-events">NO EVENTS YET</div>';
            return `
              <section class="category">
                <button class="category-button" type="button" data-bs-toggle="collapse" data-bs-target="#category-${escapeHtml(category.id)}" aria-expanded="false">
                  <span>${escapeHtml(category.name)} <span class="sub">${escapeHtml(category.englishName || '')}</span></span><span class="arrow">⌄</span>
                </button>
                <div id="category-${escapeHtml(category.id)}" class="collapse"><div class="event-grid">${body}</div></div>
              </section>`;
          }).join('');
        } catch (error) {
          console.error(error);
          root.innerHTML = '<div class="empty-events">FAILED TO LOAD EVENTS</div>';
        }
      }
      loadCompetitions();
    </script>
</body>
</html>
